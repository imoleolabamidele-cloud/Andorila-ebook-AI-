<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10051f">
<title>Indorila ebook AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
:root {
    --purple:#a855f7;
    --purple2:#7c3aed;
    --bg:#10051f;
    --glass:rgba(24,12,42,.88);
    --border:rgba(255,255,255,.13);
    --text:#fff;
    --muted:#c3b5d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    background-color:var(--bg);
    background-image:linear-gradient(rgba(12,4,25,.65),rgba(12,4,25,.75)),url("background.png");
    background-size:cover;background-position:center;background-attachment:fixed
}
button,textarea,input{font:inherit}
button{cursor:pointer}
.app{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header{
    width:100%;padding:18px 6%;display:flex;align-items:center;gap:13px;
    border-bottom:1px solid var(--border);background:rgba(13,5,26,.65);
    backdrop-filter:blur(18px)
}
.logo{width:43px;height:43px;object-fit:contain;border-radius:12px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.5px}
.brand span{color:#c084fc}
.intro{text-align:center;padding:75px 20px 30px}
.intro h1{
    font-size:clamp(28px,5vw,43px);line-height:1.2;font-weight:800;
    background:linear-gradient(90deg,#fff,#d8b4fe,#a855f7);
    -webkit-background-clip:text;background-clip:text;color:transparent
}
.intro p{max-width:540px;margin:15px auto 0;color:var(--muted);line-height:1.7;font-size:15px}
.chat-area{
    width:min(850px,92%);margin:30px auto;flex:1;
    display:flex;flex-direction:column
}
.messages{width:100%;display:flex;flex-direction:column;gap:18px}
.message{
    max-width:85%;padding:15px 19px;border-radius:18px;
    line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap
}
.user-message{
    align-self:flex-end;background:linear-gradient(135deg,#9333ea,#6d28d9);
    border-bottom-right-radius:5px
}
.ai-message{
    align-self:flex-start;background:rgba(25,13,43,.9);
    border:1px solid var(--border);border-bottom-left-radius:5px
}
.composer{
    position:sticky;bottom:15px;margin-top:auto;padding:12px;
    display:flex;align-items:flex-end;gap:12px;
    border:1px solid rgba(192,132,252,.4);border-radius:25px;
    background:rgba(24,12,42,.96);backdrop-filter:blur(20px);
    box-shadow:0 10px 45px rgba(0,0,0,.3)
}
#prompt{
    flex:1;width:100%;min-height:42px;max-height:170px;
    resize:none;overflow-y:auto;outline:none;border:none;
    color:white;background:transparent;padding:12px 8px;
    font-size:15px;line-height:1.6
}
#prompt::placeholder{color:#a99ab9}
.send-btn{
    width:46px;height:46px;min-width:46px;border:none;border-radius:50%;
    color:white;background:linear-gradient(135deg,#c084fc,#7c3aed);
    display:grid;place-items:center;transition:.2s
}
.send-btn:hover{transform:scale(1.07);box-shadow:0 0 20px rgba(168,85,247,.6)}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.send-btn svg{width:21px;height:21px}
.typing{
    display:none;align-self:flex-start;align-items:center;gap:6px;
    padding:17px 20px;background:rgba(25,13,43,.9);
    border:1px solid var(--border);border-radius:18px
}
.typing.active{display:flex}
.typing span{
    width:7px;height:7px;background:#c084fc;border-radius:50%;
    animation:typing 1.1s infinite ease-in-out
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-7px);opacity:1}
}
.result{
    display:none;width:min(850px,92%);margin:25px auto 60px;
    padding:25px;border:1px solid var(--border);border-radius:23px;
    background:var(--glass);backdrop-filter:blur(20px)
}
.result.visible{display:block}
.result h2{font-size:20px;margin-bottom:20px}
.book-card{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.cover{
    width:230px;aspect-ratio:1/1;object-fit:cover;border-radius:15px;
    border:1px solid var(--border);box-shadow:0 12px 35px rgba(0,0,0,.4)
}
.book-title{font-size:19px;font-weight:bold;text-align:center}
.actions{width:100%;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.action-btn{
    flex:1;min-width:110px;max-width:180px;padding:14px 12px;
    border:1px solid var(--border);border-radius:13px;color:white;
    background:rgba(255,255,255,.07);font-weight:bold;transition:.2s
}
.action-btn:hover{background:var(--purple2)}
.download-btn{background:linear-gradient(135deg,#a855f7,#6d28d9);border:none}
.status{text-align:center;font-size:13px;color:var(--muted);margin-top:15px}
.error{color:#fca5a5;font-size:14px;line-height:1.6;padding:12px}
.modal{
    position:fixed;inset:0;z-index:1000;display:none;
    align-items:center;justify-content:center;padding:18px;
    background:rgba(0,0,0,.8);backdrop-filter:blur(10px)
}
.modal.open{display:flex}
.modal-content,.payment-content{
    width:min(650px,100%);max-height:85vh;overflow-y:auto;
    position:relative;padding:27px;border-radius:20px;
    background:#1b0d2e;border:1px solid rgba(192,132,252,.35)
}
.payment-content{width:min(390px,100%);text-align:center}
.close-modal{
    position:absolute;right:17px;top:12px;border:none;
    color:white;background:transparent;font-size:30px
}
.payment-content h2{font-size:22px;margin:10px 0 20px}
.payment-cover{width:135px;height:135px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.payment-content h3{font-size:16px;margin-bottom:8px}
.payment-format{font-size:11px;color:#c4b5fd;letter-spacing:2px}
.price{font-size:30px;font-weight:800;margin:18px 0}
.email-label{
    display:block;text-align:left;color:#d8b4fe;
    font-size:13px;margin:15px 0 7px
}
.email-input{
    width:100%;padding:14px;border:1px solid rgba(192,132,252,.4);
    border-radius:11px;background:rgba(255,255,255,.06);
    color:white;outline:none
}
.email-input:focus{border-color:#c084fc}
.email-input::placeholder{color:#a99ab9}
.pay-btn{
    width:100%;padding:16px;color:white;border:none;
    border-radius:12px;font-weight:bold;
    background:linear-gradient(135deg,#a855f7,#6d28d9);
    margin-top:15px
}
.pay-btn:disabled{opacity:.5;cursor:not-allowed}
.payment-status{font-size:12px;color:#c4b5fd;margin-top:15px;line-height:1.5}
#previewContent{line-height:1.8;color:#eee;overflow-wrap:anywhere}
#previewContent h1,#previewContent h2,#previewContent h3{
    color:#d8b4fe;margin:22px 0 12px
}
#previewContent p{margin-bottom:14px}
#previewContent strong{color:white;font-weight:800}
#previewContent li{margin-left:22px}
@media(max-width:600px){
    .header{padding:15px 5%}
    .intro{padding-top:55px}
    .result{padding:18px}
    .actions{gap:8px}
    .action-btn{min-width:90px;padding:13px 7px;font-size:12px}
    .cover{width:200px}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
    <img src="logo.png" class="logo" alt="Indorila logo">
    <div class="brand">Indorila <span>ebook AI</span></div>
</header>

<section class="intro">
    <h1>Turn Your Ideas Into Books</h1>
    <p>Turn your ideas into beautifully written, professionally designed ebooks with AI.</p>
</section>

<main class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <form class="composer" id="chatForm">
        <textarea id="prompt" rows="1" maxlength="12000"
            placeholder="Describe the ebook you want to create..." required></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path>
            </svg>
        </button>
    </form>
</main>

<section class="result" id="result">
    <h2>Your ebook is ready</h2>
    <div class="book-card">
        <img id="bookCover" class="cover" src="background.png" alt="Generated ebook cover">
        <div class="book-title" id="bookTitle"></div>
        <div class="actions">
            <button class="action-btn" id="previousBtn">Previous</button>
            <button class="action-btn" id="previewBtn">Preview</button>
            <button class="action-btn download-btn" id="downloadBtn">Download</button>
        </div>
        <div class="status" id="bookStatus"></div>
    </div>
</section>
</div>

<div id="previewModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" id="closePreview" aria-label="Close preview">&times;</button>
        <div id="previewContent"></div>
    </div>
</div>

<div id="paymentModal" class="modal">
    <div class="payment-content">
        <button class="close-modal" id="closePayment" aria-label="Close payment">&times;</button>
        <h2>Download Your Ebook</h2>
        <img id="paymentCover" class="payment-cover" src="background.png" alt="Ebook cover">
        <h3 id="paymentTitle"></h3>
        <p class="payment-format">PDF DOCUMENT</p>
        <div class="price">$6.00 USD</div>

        <label class="email-label" for="customerEmail">Email address for payment</label>
        <input class="email-input" id="customerEmail" type="email"
            maxlength="254" autocomplete="email" placeholder="you@example.com" required>

        <button id="payBtn" class="pay-btn">Pay $6 &amp; Download</button>
        <p id="paymentStatus" class="payment-status">Secure payment checkout</p>
    </div>
</div>

<script>
"use strict";

const API_ENDPOINT="/api/generate";
const messages=document.getElementById("messages");
const promptInput=document.getElementById("prompt");
const chatForm=document.getElementById("chatForm");
const sendBtn=document.getElementById("sendBtn");
const typing=document.getElementById("typing");
const result=document.getElementById("result");
const bookCover=document.getElementById("bookCover");
const bookTitle=document.getElementById("bookTitle");
const bookStatus=document.getElementById("bookStatus");
const previewModal=document.getElementById("previewModal");
const paymentModal=document.getElementById("paymentModal");

let currentBook=null;
let previousBook=null;
let generationBusy=false;

function addMessage(content,type){
    const element=document.createElement("div");
    element.className="message "+type;
    element.textContent=content;
    messages.appendChild(element);
    element.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function showTyping(show){typing.classList.toggle("active",show)}

function setBusy(value){
    generationBusy=value;
    sendBtn.disabled=value;
    promptInput.disabled=value;
    showTyping(value);
}

function scrollToBottom(){
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function resizeInput(){
    promptInput.style.height="auto";
    promptInput.style.height=Math.min(promptInput.scrollHeight,170)+"px";
}

promptInput.addEventListener("input",resizeInput);
promptInput.addEventListener("keydown",event=>{
    if(event.key==="Enter"&&!event.shiftKey){
        event.preventDefault();
        if(!generationBusy) chatForm.requestSubmit();
    }
});

function validateBook(data){
    if(!data||typeof data!=="object") throw new Error("The AI returned an invalid response.");
    if(typeof data.title!=="string"||!data.title.trim()) throw new Error("The ebook title is missing.");
    if(typeof data.introduction!=="string"||!data.introduction.trim()) throw new Error("The ebook introduction is incomplete.");
    if(typeof data.conclusion!=="string"||!data.conclusion.trim()) throw new Error("The ebook conclusion is incomplete.");
    if(!Array.isArray(data.chapters)||data.chapters.length<1||data.chapters.length>30)
        throw new Error("The ebook must contain between 1 and 30 chapters.");

    for(const chapter of data.chapters){
        if(!chapter||typeof chapter.title!=="string"||!chapter.title.trim()||
           typeof chapter.content!=="string"||!chapter.content.trim())
            throw new Error("An ebook chapter is incomplete.");
    }
    return data;
}

async function apiRequest(payload){
    const response=await fetch(API_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
    });
    let data;
    try{data=await response.json()}
    catch{throw new Error("The server returned an invalid response.")}
    if(!response.ok||data.success===false)
        throw new Error(data.error||"The request could not be completed.");
    return data;
}

async function generateBook(userPrompt){
    setBusy(true);
    addMessage(userPrompt,"user-message");
    result.classList.remove("visible");
    scrollToBottom();

    try{
        const data=await apiRequest({
            action:"generate",
            prompt:userPrompt,
            max_chapters:30,
            automatic_chapters:true,
            expand_short_prompt:true,
            bold_formatting:true
        });

        const newBook=validateBook(data.book);
        newBook.prompt=userPrompt;

        previousBook=currentBook;
        currentBook=newBook;

        sessionStorage.setItem("indorila_current_book",JSON.stringify(currentBook));
        renderBook(currentBook);
        addMessage("Your ebook has been generated successfully.","ai-message");
    }catch(err){
        addMessage(err.message||"Something went wrong. Please try again.","ai-message");
    }finally{
        setBusy(false);
        promptInput.value="";
        resizeInput();
        scrollToBottom();
    }
}

function renderBook(book){
    bookTitle.textContent=book.title;
    bookCover.src=book.cover_url||"background.png";
    bookCover.onerror=function(){this.onerror=null;this.src="background.png"};
    bookStatus.textContent=book.chapters.length+" chapters generated";
    result.classList.add("visible");
    scrollToBottom();
}
chatForm.addEventListener("submit",event=>{
    event.preventDefault();
    const userPrompt=promptInput.value.trim();
    if(!userPrompt||generationBusy) return;
    generateBook(userPrompt);
});

/* PREVIOUS BOOK: swaps the current and previous books */
document.getElementById("previousBtn").addEventListener("click",()=>{
    if(!previousBook){
        bookStatus.textContent="There is no previous ebook in this session.";
        return;
    }
    const temporary=currentBook;
    currentBook=previousBook;
    previousBook=temporary;
    renderBook(currentBook);
});

/* SAFE MARKDOWN RENDERING */
function escapeHTML(value){
    return String(value).replace(/[&<>"']/g,char=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);
}

function formatText(value){
    let text=escapeHTML(value);
    text=text.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    text=text.replace(/^### (.+)$/gm,"<h3>$1</h3>");
    text=text.replace(/^## (.+)$/gm,"<h2>$1</h2>");
    text=text.replace(/^# (.+)$/gm,"<h1>$1</h1>");
    text=text.replace(/\n\n/g,"</p><p>");
    text=text.replace(/\n/g,"<br>");
    return "<p>"+text+"</p>";
}

/* PREVIEW */
document.getElementById("previewBtn").addEventListener("click",()=>{
    if(!currentBook) return;

    let html=`<h1>${escapeHTML(currentBook.title)}</h1>
        <p><strong>Generated by Indorila ebook AI</strong></p>`;

    if(currentBook.introduction)
        html+=`<h2>Introduction</h2>${formatText(currentBook.introduction)}`;

    html+="<h2>Table of Contents</h2><ol>";
    currentBook.chapters.forEach(chapter=>{
        html+=`<li>${escapeHTML(chapter.title)}</li>`;
    });
    html+="</ol>";

    currentBook.chapters.forEach((chapter,index)=>{
        html+=`<h2>Chapter ${index+1}: ${escapeHTML(chapter.title)}</h2>
            ${formatText(chapter.content)}`;
    });

    if(currentBook.conclusion)
        html+=`<h2>Conclusion</h2>${formatText(currentBook.conclusion)}`;

    document.getElementById("previewContent").innerHTML=html;
    previewModal.classList.add("open");
});

document.getElementById("closePreview").addEventListener("click",()=>{
    previewModal.classList.remove("open");
});

/* CLOSE MODALS WHEN BACKDROP IS CLICKED */
[previewModal,paymentModal].forEach(modal=>{
    modal.addEventListener("click",event=>{
        if(event.target===modal) modal.classList.remove("open");
    });
});

document.addEventListener("keydown",event=>{
    if(event.key==="Escape"){
        previewModal.classList.remove("open");
        paymentModal.classList.remove("open");
    }
});

/* PDF TEXT WITH BOLD SUPPORT AND PAGE BREAKS */
function addFormattedText(doc,text,x,y,maxWidth,lineHeight){
    const lines=String(text||"").split("\n");
    const pageBottom=280;
    const usableWidth=maxWidth;

    for(const paragraph of lines){
        const parts=paragraph.split(/(\*\*.*?\*\*)/g);
        let currentLine="";
        let currentBold=false;

        function writeLine(){
            if(!currentLine) return;
            if(y>pageBottom){doc.addPage();y=22}
            doc.setFont("helvetica",currentBold?"bold":"normal");
            doc.text(currentLine,x,y);
            y+=lineHeight;
            currentLine="";
        }

        for(const part of parts){
            const bold=part.startsWith("**")&&part.endsWith("**");
            const clean=bold?part.slice(2,-2):part;
            const words=clean.split(/\s+/).filter(Boolean);

            if(currentLine&&currentBold!==bold) writeLine();
            currentBold=bold;
            doc.setFont("helvetica",bold?"bold":"normal");

            for(const word of words){
                const candidate=currentLine?currentLine+" "+word:word;
                if(doc.getTextWidth(candidate)>usableWidth&&currentLine){
                    writeLine();
                }
                currentLine=currentLine?currentLine+" "+word:word;
            }
        }
        writeLine();
        y+=4;
        if(y>pageBottom){doc.addPage();y=22}
    }
    return y;
}

function safeFilename(title){
    const name=String(title||"Indorila_Ebook")
        .replace(/[<>:"/\\|?*\x00-\x1F]/g,"")
        .trim()
        .replace(/\s+/g,"_")
        .slice(0,100);
    return (name||"Indorila_Ebook")+".pdf";
}

async function addCoverPage(doc,book){
    if(!book.cover_url||!book.cover_url.startsWith("data:image/")) return false;
    try{
        const format=book.cover_url.startsWith("data:image/png")?"PNG":"JPEG";
        doc.addImage(book.cover_url,format,20,35,170,170);
        doc.setFont("helvetica","bold");
        doc.setFontSize(20);
        const titleLines=doc.splitTextToSize(book.title,170);
        doc.text(titleLines,105,225,{align:"center"});
        doc.setFont("helvetica","normal");
        doc.setFontSize(10);
        doc.text("Created with Indorila ebook AI",105,260,{align:"center"});
        return true;
    }catch(err){
        console.warn("PDF cover could not be added:",err.message);
        return false;
    }
}

async function createPDF(book){
    if(!window.jspdf||!window.jspdf.jsPDF)
        throw new Error("PDF generation library is unavailable.");

    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const margin=20;
    const maxWidth=170;
    let y=22;

    const hasCover=await addCoverPage(doc,book);
    if(hasCover) doc.addPage();

    doc.setFont("helvetica","bold");
    doc.setFontSize(24);
    const titleLines=doc.splitTextToSize(book.title,maxWidth);
    doc.text(titleLines,margin,y);
    y+=titleLines.length*11+8;

    doc.setFont("helvetica","normal");
    doc.setFontSize(10);
    doc.text("Created with Indorila ebook AI",margin,y);
    y+=18;

    doc.setFont("helvetica","bold");
    doc.setFontSize(17);
    doc.text("Table of Contents",margin,y);
    y+=12;
    doc.setFont("helvetica","normal");
    doc.setFontSize(11);

    for(let i=0;i<book.chapters.length;i++){
        const lines=doc.splitTextToSize((i+1)+". "+book.chapters[i].title,maxWidth);
        if(y+lines.length*6>280){doc.addPage();y=22}
        doc.text(lines,margin,y);
        y+=lines.length*6+3;
    }

    doc.addPage();
    y=22;
    doc.setFont("helvetica","bold");
    doc.setFontSize(19);
    doc.text("Introduction",margin,y);
    y+=14;
    doc.setFontSize(11);
    y=addFormattedText(doc,book.introduction,margin,y,maxWidth,6);

    for(let i=0;i<book.chapters.length;i++){
        doc.addPage();
        y=22;
        doc.setFont("helvetica","bold");
        doc.setFontSize(18);
        const heading=doc.splitTextToSize(
            "Chapter "+(i+1)+": "+book.chapters[i].title,maxWidth
        );
        doc.text(heading,margin,y);
        y+=heading.length*9+10;
        doc.setFontSize(11);
        y=addFormattedText(doc,book.chapters[i].content,margin,y,maxWidth,6);
    }

    doc.addPage();
    y=22;
    doc.setFont("helvetica","bold");
    doc.setFontSize(19);
    doc.text("Conclusion",margin,y);
    y+=14;
    doc.setFontSize(11);
    addFormattedText(doc,book.conclusion,margin,y,maxWidth,6);

    doc.save(safeFilename(book.title));
}
/* PAYMENT MODAL */
document.getElementById("downloadBtn").addEventListener("click",()=>{
    if(!currentBook) return;

    document.getElementById("paymentTitle").textContent=currentBook.title;
    document.getElementById("paymentCover").src=currentBook.cover_url||"background.png";
    document.getElementById("paymentStatus").textContent="Secure payment checkout";
    document.getElementById("payBtn").disabled=false;
    paymentModal.classList.add("open");
});

document.getElementById("closePayment").addEventListener("click",()=>{
    paymentModal.classList.remove("open");
});

/* Only send ebook text required for server-side payment binding. */
function paymentBookData(book){
    return {
        title:book.title,
        introduction:book.introduction,
        chapters:book.chapters.map(chapter=>({
            title:chapter.title,
            content:chapter.content
        })),
        conclusion:book.conclusion
    };
}

document.getElementById("payBtn").addEventListener("click",async function(){
    if(!currentBook) return;

    const button=this;
    const status=document.getElementById("paymentStatus");
    const emailInput=document.getElementById("customerEmail");
    const email=emailInput.value.trim();

    if(!emailInput.checkValidity()||!email){
        status.textContent="Please enter a valid email address.";
        emailInput.focus();
        return;
    }

    button.disabled=true;
    status.textContent="Creating secure payment...";

    try{
        const bookForPayment=paymentBookData(currentBook);

        const data=await apiRequest({
            action:"create_payment",
            customer_email:email,
            book:bookForPayment
        });

        if(!data.checkout_url||!data.reference)
            throw new Error("The payment provider returned incomplete checkout details.");

        const checkoutURL=new URL(data.checkout_url);
        if(checkoutURL.protocol!=="https:"||
           !/(^|\.)paymegate\.com$/i.test(checkoutURL.hostname))
            throw new Error("The payment provider returned an invalid checkout address.");

        sessionStorage.setItem("indorila_paid_book",JSON.stringify(currentBook));
        sessionStorage.setItem("indorila_payment_reference",data.reference);

        window.location.assign(checkoutURL.href);
    }catch(err){
        status.textContent=err.message||"Unable to create payment.";
        button.disabled=false;
    }
});

/* VERIFY PAYMENT WHEN PAYMEGATE RETURNS THE CUSTOMER */
async function verifyReturnedPayment(){
    const params=new URLSearchParams(location.search);
    const reference=params.get("reference");
    if(!reference) return;

    const savedReference=sessionStorage.getItem("indorila_payment_reference");
    const savedBook=sessionStorage.getItem("indorila_paid_book");

    if(!savedReference||reference!==savedReference||!savedBook) return;

    try{
        const book=validateBook(JSON.parse(savedBook));

        const data=await apiRequest({
            action:"verify_payment",
            reference:reference,
            book:paymentBookData(book)
        });

        if(data.paid!==true){
            throw new Error("Payment has not been confirmed yet. Please try again later.");
        }

        currentBook=book;
        renderBook(currentBook);
        await createPDF(currentBook);

        sessionStorage.removeItem("indorila_paid_book");
        sessionStorage.removeItem("indorila_payment_reference");

        history.replaceState({},document.title,location.pathname);
        document.getElementById("paymentStatus").textContent="Payment confirmed.";
    }catch(err){
        alert("Payment verification: "+err.message);
    }
}

verifyReturnedPayment();
</script>
